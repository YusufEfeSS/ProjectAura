name: Build Aura APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Kaynak kodunu hazirla
        run: unzip -q -o ProjectAura.zip -d aura-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android lisanslarini kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Debug APK derle
        working-directory: aura-src
        run: gradle assembleDebug --stacktrace --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: ProjectAura-debug-apk
          path: aura-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
